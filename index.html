<!DOCTYPE html><html lang="tr"><meta charset="utf-8">
<title>Yeşil Rapor Formu</title>
<style>body{font-family:sans-serif;padding:2rem;max-width:480px;margin:auto}
input,button{width:100%;margin:.4rem 0;padding:.6rem;font-size:1rem}</style>
<h2>Yeşil Rapor</h2>
<form id="f">
  <input name="firma"   placeholder="Firma Adı"   required>
  <input name="elektrik"placeholder="Elektrik (kWh)" type="number" step="any" required>
  <input name="yakit"   placeholder="Yakıt (L)"     type="number" step="any" required>
  <input name="su"      placeholder="Su (m³)"       type="number" step="any" required>
  <input name="atik"    placeholder="Atık (kg)"     type="number" step="any" required>
  <button>Raporu Oluştur</button>
</form>
<p id="out"></p>
<script>
const URL='https://script.google.com/macros/s/AKfycbwTAY-_P2DqOKT9Y8gPzt651eu-E-W9nOXsuMlUFtwKqq6JkyEZSZ24Dx6yhMLdTCltRQ/exec'; // kendi /exec linkin

document.getElementById('f').onsubmit=async ev=>{
  ev.preventDefault();
  const fd=new FormData(ev.target);
  const resp=await fetch(URL,{method:'POST',body:new URLSearchParams(fd)});
  const link=await resp.text();
  document.getElementById('out').innerHTML=
    link.startsWith('http')?`PDF hazır: <a href="${link}" target="_blank">İndir/Gör</a>`
                           :'Hata: '+link;
};
</script>
</html>
